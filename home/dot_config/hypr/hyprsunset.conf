# Makes hyprsunset do nothing to the screen by default
# Without this, the default applies some tint to the monitor
# NOTE: this depends on Omarchy autostarting hyprsunset by default (that
# autostart lives in Omarchy's own config, not in this repo's autostart.lua)
# - if a future Omarchy release stops autostarting hyprsunset, this file
# silently becomes a no-op with no visible signal that anything changed.
profile {
    time = 07:00
    identity = true
}

# To enable auto switch to nightlight, add to your .config/hypr/autostart.lua:
# o.launch_on_start("hyprsunset")
# and use the following:
# profile {
#     time = 20:00
#     temperature = 4000
# }
