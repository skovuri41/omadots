# Mirrors the Omarchy tmux config in config/tmux/tmux.conf
# tmux session -> herdr workspace, tmux window -> herdr tab, tmux pane -> herdr pane

[theme]
# tmux ran on the terminal's own palette (bg=default, fg=default, ANSI blue accents)
name = "terminal"

[theme.custom]
# The active tab is drawn as panel_bg text on an accent background, so panel_bg
# has to be dark for it to read - same colors as status-left's "#[fg=black,bg=blue]"
panel_bg = "black"

[terminal]
# Matches -c "#{pane_current_path}" on every split, window, and session
new_cwd = "follow"

[keys]
prefix = "ctrl+space"

# Config and help
#
# Moved off plain prefix+q (freed for close_tab below, see the Panes/tabs
# comments) onto prefix+shift+q - matches ../tmux/tmux.conf's Q, same
# reasoning there.
reload_config = "prefix+shift+q"
help = "prefix+?"
detach = "prefix+d"

# Copy mode
copy_mode = "prefix+["

# Panes
#
# VIM/DOOM COHERENCE (added so herdr muscle memory matches evil-mode's
# window commands - see the matching block in ../tmux/tmux.conf, which
# mirrors this 1:1, same reasoning): evil's own window map (bound in Doom
# under SPC w, and available everywhere as plain C-w since it's vanilla
# evil, not Doom-specific - evil-maps.el) uses:
#   SPC w s / C-w s -> horizontal split   SPC w v / C-w v -> vertical split
#   SPC w h/j/k/l   / C-w h/j/k/l -> move focus left/down/up/right
# That's an exact geometry match for herdr's own split_horizontal (top/bottom
# stacked, dividing line horizontal) / split_vertical (side by side, dividing
# line vertical) naming - so split_horizontal moves off prefix+h onto
# prefix+s (freeing h for focus movement below), and split_vertical's prefix+v
# was already correct, no change needed there.
#
# Resizing deliberately stays off hjkl (ctrl+alt+shift+arrows, unchanged
# below) - vim itself doesn't use hjkl for resize (that's what
# evil-window-increase-height/-width etc. use +/-/</> for), so overloading
# hjkl with a second meaning here would work against muscle memory, not for
# it.
split_horizontal = ["prefix+s", "alt+enter"]
split_vertical = ["prefix+v", "alt+shift+enter"]
close_pane = ["prefix+x", "alt+esc"]
zoom = "prefix+z"
last_pane = "prefix+;"

# prefix+h/j/k/l added as the primary vim/evil-style trigger (SPC w h/j/k/l
# in Doom, C-w h/j/k/l anywhere evil runs); ctrl+alt+arrow kept as a
# secondary/fallback trigger since it doesn't conflict with anything and was
# already muscle memory from before this change.
focus_pane_left = ["prefix+h", "ctrl+alt+left"]
focus_pane_down = ["prefix+j", "ctrl+alt+down"]
focus_pane_up = ["prefix+k", "ctrl+alt+up"]
focus_pane_right = ["prefix+l", "ctrl+alt+right"]

# STICKY RESIZE, confirmed against herdr's real source (github.com/herdrdev/
# herdr, src/app/input/modal.rs::handle_resize_key_via_api - not the docs
# site, which is established elsewhere in this file as unreliable):
# resize_mode is a genuine MODAL resize, distinct from and superior to the
# one-shot resize_pane_* actions this replaced (removed below - see why).
# Once triggered, herdr enters Mode::Resize and its key handler is hardcoded
# (not configurable) to:
#   h / Left  -> shrink/grow width one way    l / Right -> the other way
#   j / Down  -> shrink/grow height one way    k / Up    -> the other way
#   Esc, Enter, or re-pressing this same trigger -> exit back to normal mode
# That h/l = width, j/k = height mapping is an exact, first-party match for
# the same physical h/j/k/l used by focus_pane_left/down/up/right above -
# same fingers, same geometry, just a contextual mode switch (identical in
# spirit to vim itself: hjkl always means "left/down/up/right", the meaning
# just depends what mode you're in). And because it's modal, holding/
# repeating h/j/k/l keeps resizing with no need to re-press the prefix each
# time - this is what actually answers "the resize options are not sticky":
# the fix isn't a flag on resize_pane_*, it's using resize_mode instead.
#
# prefix+- added as a trigger alongside the pre-existing prefix+ctrl+arrow
# set, for the same "-" = resize theme as Hyprland's own resize binds and
# ../tmux/tmux.conf's prefix+- (which stays a direct one-shot resize there,
# since tmux has no modal equivalent - its own -r flag is what makes IT
# sticky instead). Freed up by dropping resize_pane_left/right/up/down
# below: those were my Round-3 attempt at Hyprland-pattern coherence before
# resize_mode's real semantics were confirmed, used unverified "prefix+-"/
# "prefix+shift+-" punctuation syntax, and are now fully superseded by this
# - same physical entry key, strictly better (repeatable) behavior once
# inside, and one less pair of unverified/guessed bindings in this file.
resize_mode = ["prefix+-", "prefix+ctrl+left", "prefix+ctrl+down", "prefix+ctrl+up", "prefix+ctrl+right"]

# No tmux equivalent; herdr's default prefix+shift+p is taken by previous session
rename_pane = "prefix+shift+o"

# Windows -> tabs
new_tab = "prefix+c"
rename_tab = "prefix+r"
# Moved off prefix+k (freed for focus_pane_up above - plain k was colliding
# with this) onto prefix+q, your call - matches ../tmux/tmux.conf's "Kill
# window" q, and reads fine as "quit this tab."
close_tab = "prefix+q"
switch_tab = ["prefix+1..9", "alt+1..9"]
previous_tab = ["prefix+p", "alt+left"]
next_tab = ["prefix+n", "alt+right"]

# Like swap-window -t -1/+1 on M-S-Left/Right
move_tab_previous = "alt+shift+left"
move_tab_next = "alt+shift+right"

# Sessions -> workspaces
new_workspace = "prefix+shift+c"
rename_workspace = "prefix+shift+r"
close_workspace = "prefix+shift+k"
previous_workspace = ["prefix+shift+p", "alt+up"]
next_workspace = ["prefix+shift+n", "alt+down"]

[ui]
accent = "blue"

# tmux drew single-line dividers between adjacent panes and no outer frame
pane_gaps = false
pane_outer_borders = false

# tmux had no scrollbar column beside its panes
pane_scrollbars = false

# kill-window and kill-session never asked
confirm_close = false

# automatic-rename gave windows a name without prompting
prompt_new_tab_name = false

# set -g mouse on
mouse_capture = true

# status-right had the zoom flag followed by #h
tab_bar_right = [{ type = "zoom" }, { type = "hostname" }]

# set -g set-titles on / set -g set-titles-string '#h:#W', where tmux's #W was
# the basename of the pane cwd. This is what Hyprland shows in the group bar,
# and it resolves on the server so remote sessions name the remote host.
window_title = "{hostname}: {workspace}"
