# Prefix
set -g prefix C-Space
set -g prefix2 C-b
bind -N "Send prefix" C-Space send-prefix

# Config and help
#
# Reload moved off q (Q = shift+q now) to free plain q for "Kill window"
# below, matching vim/close-buffer-ish q-to-quit muscle memory for the
# higher-frequency action - part of the same VIM/DOOM COHERENCE pass as the
# Pane Controls section further down; see the comment block there.
bind -N "Reload configuration" Q source-file ~/.config/tmux/tmux.conf \; display "Configuration reloaded"
bind -N "Show Tmux keybindings" ? display-popup -E -w 80% -h 70% -T "Tmux keybindings" "omarchy-menu-tmux-keybindings --print | less -R"

# Vi mode for copy
setw -g mode-keys vi
bind -N "Begin selection" -T copy-mode-vi v send -X begin-selection
bind -N "Copy selection" -T copy-mode-vi y send -X copy-selection-and-cancel

# Pane Controls
bind -N "Split pane vertically" -n M-Enter split-window -v -c "#{pane_current_path}"
bind -N "Split pane horizontally" -n M-S-Enter split-window -h -c "#{pane_current_path}"
bind -N "Kill pane" -n M-Escape kill-pane

# VIM/DOOM COHERENCE (mirrors ../herdr/config.toml's [keys] block, same
# reasoning there in full): evil-mode's own window map - SPC w in Doom, or
# plain C-w anywhere evil runs, since it's vanilla evil (evil-maps.el), not
# Doom-specific - uses s/v for horizontal/vertical split and h/j/k/l for
# focus movement. tmux's own -v flag ("split vertically" in tmux's
# vocabulary: panes stacked top/bottom, horizontal dividing line) is the
# same geometry as vim's horizontal split (SPC w s / C-w s), so that's what
# moved off the h key onto s below - freeing h for focus movement. tmux's
# -h flag (side-by-side panes, vertical dividing line = vim's vertical
# split) was already correctly on v, unchanged.
bind -N "Split pane vertically (vim: horizontal split, SPC w s / C-w s)" s split-window -v -c "#{pane_current_path}"
bind -N "Split pane horizontally (vim: vertical split, SPC w v / C-w v)" v split-window -h -c "#{pane_current_path}"
bind -N "Kill pane" x kill-pane

# prefix+h/j/k/l: primary vim/evil-style focus trigger (SPC w h/j/k/l in
# Doom, C-w h/j/k/l anywhere evil runs). Resizing deliberately stays off
# hjkl below (ctrl+alt+shift+arrows, unchanged) - vim itself uses +/-/</>
# for resize, not hjkl, so doubling up hjkl with a second meaning here would
# work against muscle memory, not for it.
bind -N "Focus pane left" h select-pane -L
bind -N "Focus pane down" j select-pane -D
bind -N "Focus pane up" k select-pane -U
bind -N "Focus pane right" l select-pane -R

# ctrl+alt+arrow kept as a secondary/fallback trigger (unprefixed, no vim
# meaning) since it doesn't conflict with anything and was already muscle
# memory from before this change.
bind -N "Focus pane left" -n C-M-Left select-pane -L
bind -N "Focus pane right" -n C-M-Right select-pane -R
bind -N "Focus pane up" -n C-M-Up select-pane -U
bind -N "Focus pane down" -n C-M-Down select-pane -D

# VIM/HYPRLAND COHERENCE (mirrors ../herdr/config.toml's resize_pane_* block
# below, same reasoning in full there): matches the physical keys Hyprland's
# own default resize binds use (SUPER+code:20/21 = the "-"/"=" keys on a US
# layout, SHIFT flips to the vertical axis) - not a literal semantic port
# (Hyprland's default only touches 2 of 4 edges; tmux already has a real,
# independent bind for all four), just the physical key choice and the
# "shift = vertical axis" pattern, paired the natural way: minus/equal =
# left/right, shift+minus/shift+equal = up/down. Unlike herdr's config,
# there's no ambiguity here about how tmux spells "shift+minus" - a
# terminal only ever sees the resulting character for a shifted printable
# key (there's no raw keycode channel the way Hyprland has), so shift+minus
# is bound on the literal "_" it produces, and shift+equal on "+". These
# still require the prefix first like every other bind here (not -n), so
# they don't interfere with typing "_"/"+" normally.
bind -N "Resize pane left" - resize-pane -L 5
bind -N "Resize pane right" = resize-pane -R 5
bind -N "Resize pane up" _ resize-pane -U 5
bind -N "Resize pane down" + resize-pane -D 5

# ctrl+alt+shift+arrow kept as a secondary/fallback trigger, unchanged from
# before this change.
bind -N "Resize pane left" -n C-M-S-Left resize-pane -L 5
bind -N "Resize pane down" -n C-M-S-Down resize-pane -D 5
bind -N "Resize pane up" -n C-M-S-Up resize-pane -U 5
bind -N "Resize pane right" -n C-M-S-Right resize-pane -R 5

# Window navigation
bind -N "Rename window" r command-prompt -I "#W" "rename-window -- '%%'"
bind -N "Create window" c new-window -c "#{pane_current_path}"
# Moved off k (freed for "Focus pane up" above, k was shadowing it since
# tmux silently lets the later bind in the file win on a collision) onto q -
# your call, matches herdr's close_tab below and reads fine as "quit this
# window."
bind -N "Kill window" q kill-window

bind -N "Switch to window 1" -n M-1 select-window -t 1
bind -N "Switch to window 2" -n M-2 select-window -t 2
bind -N "Switch to window 3" -n M-3 select-window -t 3
bind -N "Switch to window 4" -n M-4 select-window -t 4
bind -N "Switch to window 5" -n M-5 select-window -t 5
bind -N "Switch to window 6" -n M-6 select-window -t 6
bind -N "Switch to window 7" -n M-7 select-window -t 7
bind -N "Switch to window 8" -n M-8 select-window -t 8
bind -N "Switch to window 9" -n M-9 select-window -t 9

bind -N "Previous window" -n M-Left select-window -t -1
bind -N "Next window" -n M-Right select-window -t +1
bind -N "Move window left" -n M-S-Left swap-window -t -1 \; select-window -t -1
bind -N "Move window right" -n M-S-Right swap-window -t +1 \; select-window -t +1

# Session controls
bind -N "Rename session" R command-prompt -I "#S" "rename-session -- '%%'"
bind -N "Create session" C new-session -c "#{pane_current_path}"
bind -N "Kill session" K kill-session
bind -N "Previous session" P switch-client -p
bind -N "Next session" N switch-client -n

bind -N "Previous session" -n M-Up switch-client -p
bind -N "Next session" -n M-Down switch-client -n

# General
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
setw -g aggressive-resize on
set -g detach-on-destroy off
set -g extended-keys on
set -g extended-keys-format csi-u
set -ag terminal-features "xterm-kitty:extkeys"
set -as terminal-features ",*:clipboard"
set -sg escape-time 10

# Status bar
set -g status-position top
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator ""
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'
set -g set-titles on
set -g set-titles-string '#h:#W'

# Theme
set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=black,bg=blue,bold] #S #[bg=default] "
set -g status-right "#[fg=blue]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=brightblack]#h "
set -g window-status-format "#[fg=brightblack] #I:#W "
set -g window-status-current-format "#[fg=blue,bold] #I:#W "
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g message-style "bg=default,fg=blue"
set -g message-command-style "bg=default,fg=blue"
set -g mode-style "bg=blue,fg=black"
setw -g clock-mode-colour blue

# --- Personal addition, layered on top of Omarchy's defaults above ---
# Flag activity in other windows (no keybinding collisions with anything
# above - this only affects the status line).
setw -g monitor-activity on
set -g visual-activity on
