[ids]
*

[main]
# Capslock: tap = Escape, hold = Control (frees the pinky-stretch key for
# the most-used modifier + most-used escape hatch in one).
capslock = overload(control, esc)

# CAGS home row mods - Control, Alt, GUI(Super), Shift from pinky to index
# on the anchor hand, mirrored on the other hand so each hand keeps its two
# most-chorded modifiers (Shift, Control) toward the keyboard's center.
# lettermod(<layer>, <key>, <idle_timeout_ms>, <hold_timeout_ms>) taps the
# letter normally on a quick press, or activates <layer> on a longer hold -
# and stays out of the way entirely during fast typing (idle_timeout).
#
# Left hand
a = lettermod(control, a, 150, 200)
s = lettermod(alt, s, 150, 200)
d = lettermod(meta, d, 150, 200)
f = lettermod(shift, f, 150, 200)
# Right hand
j = lettermod(meta, j, 150, 200)
k = lettermod(shift, k, 150, 200)
l = lettermod(alt, l, 150, 200)
semicolon = lettermod(control, semicolon, 150, 200)
