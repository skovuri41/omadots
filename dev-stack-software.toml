# dev-stack-software.toml
#
# The software list for install-dev-stack.sh. This is the ONLY file you
# need to touch to add, remove, or change a piece of software - the script
# itself (install-dev-stack.sh) never needs to change for that.
#
# Format: one [[software]] table per tool. Read via `yq` (mikefarah/yq,
# the Go one - see the "Why yq" note below), never hand-parsed.
#
# Fields:
#   name        display name, shown in --status and log output
#   method      one of: "pacman" | "aur" | "aur-fragile" | "mise" | "custom"
#   spec        method-specific "what to install" (omit the key entirely
#               for a custom entry - see below):
#                 pacman        one or more pacman package names, space
#                               separated in a single string (installed via
#                               omarchy-pkg-add, which word-splits it)
#                 aur           one AUR package name (installed via yay,
#                               via omarchy-pkg-aur-add)
#                 aur-fragile   like aur, but known to need manual steps
#                               sometimes - installed the same way as aur,
#                               but a failed build is treated as "needs a
#                               manual step" (marked ACTION NEEDED in
#                               --status) instead of a plain failure. See
#                               step_aur_fragile() in install-dev-stack.sh.
#                 mise          a mise tool@version spec, e.g. "java@latest"
#                 custom        omit this key - custom entries are wired to
#                               a specific function inside
#                               install-dev-stack.sh by their status_pkg
#                               value (see dispatch_custom() there). Adding
#                               a genuinely new bespoke install still means
#                               adding a case + function to the script -
#                               this format only removes the need to edit
#                               the script for anything pacman/AUR/mise can
#                               install, which is nearly everything.
#   status_pkg  the single package/tool name used to look up an installed/
#               available version for the --status table (for custom
#               entries, one of the fixed keys the script recognizes: doom,
#               poly, bws, emacs-daemon, keyd)
#   note        freeform, shown nowhere but here - just for you. Omit the
#               key entirely if there's nothing to say (don't write `note =
#               ""` - same effect, just noisier).
#
# Not sure how to install something new? Run:
#   ./install-dev-stack.sh --check <name>
# It probes pacman, the AUR, and mise for that name and prints a suggested
# [[software]] block to paste in below.
#
# Why yq, and why this replaced the old pipe-delimited dev-stack-
# software.txt (2026-09-11): see CHEZMOI-GUIDE.md's "Registry files moved
# to TOML" section for the full comparison (JSON was considered and
# rejected - it can't hold these comments at all, confirmed jq enforces
# strict RFC 8259 with zero comment support; TOML is also what chezmoi
# itself already uses for the same "list of things to fetch" problem in
# .chezmoiexternal.toml). `yq` here specifically means mikefarah/yq (the Go
# one, Arch package `go-yq`) - there is a different, unrelated tool also
# called `yq` (kislyuk/yq, a Python/jq wrapper) that does NOT support this
# script's `-p toml -o tsv` usage; every script that reads a .toml registry
# checks `yq --version` for the string "mikefarah" before trusting it, and
# fails with an explicit pacman hint if the wrong one (or none) is found.

[[software]]
name = "yq (via go-yq)"
method = "pacman"
spec = "go-yq"
status_pkg = "go-yq"
note = "mikefarah/yq (Go) - what every script in this repo uses to read .toml registries, including this file. Also needed to bootstrap: if you're setting up a brand new machine, install this BEFORE anything else reads a .toml file here (same chicken-and-egg reason chezmoi/bitwarden-cli are a manual pre-step in README.md's step 1, not just a registry entry)."

